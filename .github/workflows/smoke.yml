name: Tester le démonstrateur PV

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bicep:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compiler le modèle Bicep sans créer de ressources
        run: |
          bicep="$RUNNER_TEMP/bicep"
          curl --fail --location --silent --show-error --retry 2 --output "$bicep" \
            https://github.com/Azure/bicep/releases/download/v0.48.1/bicep-linux-x64
          printf '%s  %s\n' b09ec25a9d376c1f8e33ede6ed22b587f915ad68488d5db77a6f9541748c7f6e "$bicep" \
            | sha256sum --check --strict
          chmod +x "$bicep"
          "$bicep" build --no-restore infra/aks-dev.bicep --outfile "$RUNNER_TEMP/aks-dev.arm.json"
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Tester le workflow et l’API
        env:
          LANGSMITH_TRACING: 'false'
        run: |
          python -m pip install -r requirements-test.txt
          python -m unittest discover -s tests -v
      - name: Construire l’image
        run: |
          docker build --tag pv-demo:local \
            --build-arg REQUIREMENTS_FILE=requirements-azure.txt \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" .
      - name: Tester le déploiement dans un cluster kind éphémère
        run: |
          kind create cluster --name pv-demo --wait 90s
          trap 'kind delete cluster --name pv-demo' EXIT
          kind load docker-image --name pv-demo pv-demo:local
          kubectl apply -f k8s/demo.yaml
          kubectl rollout status deployment/pv-demo --timeout=90s
          kubectl port-forward service/pv-demo 18000:8000 > "$RUNNER_TEMP/pv-demo-forward.log" 2>&1 &
          curl --silent --show-error --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:18000/healthz
          python scripts/smoke.py http://127.0.0.1:18000
      - name: Conserver l’image testée pour la publication
        if: github.repository == 'bruno-giaconi/bruno-giaconi.github.io' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save pv-demo:local | gzip -1 > "$RUNNER_TEMP/pv-demo.tar.gz"
      - uses: actions/upload-artifact@v4
        if: github.repository == 'bruno-giaconi/bruno-giaconi.github.io' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: pv-demo-tested-image
          path: ${{ runner.temp }}/pv-demo.tar.gz
          retention-days: 1
          compression-level: 0
  publish-image:
    if: github.repository == 'bruno-giaconi/bruno-giaconi.github.io' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [smoke, bicep]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pv-demo-tested-image
          path: ${{ runner.temp }}
      - name: Publier l’image vérifiée dans GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/releve-decisions"
          tag="${image}:sha-${GITHUB_SHA}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker load --input "$RUNNER_TEMP/pv-demo.tar.gz"
          docker tag pv-demo:local "$tag"
          docker push "$tag"
          digest="$(docker buildx imagetools inspect "$tag" | awk '/^Digest:/ { print $2 }')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'Image de déploiement vérifiée : `%s@%s`\n' "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
