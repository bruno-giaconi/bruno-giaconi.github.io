apiVersion: apps/v1
kind: Deployment
metadata:
  name: pv-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pv-demo
  template:
    metadata:
      labels:
        app: pv-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: pv-demo:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pv-demo
spec:
  type: ClusterIP
  selector:
    app: pv-demo
  ports:
    - name: http
      port: 8000
      targetPort: http
